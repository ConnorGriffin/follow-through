name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python
        run: python3 -m compileall -q scripts tests

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Validate synthetic repository
        run: python3 scripts/validate.py examples/maya-chen

      - name: Check publication boundary
        run: python3 scripts/privacy_check.py
